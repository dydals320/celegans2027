<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>연구실 참석자 등록 · Korean C. elegans Meeting 2027</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314513a'/%3E%3Cpath d='M7 20c3-6 6 2 9-4s6 2 9-4' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--g:#14513a;--ink:#1b2620;--mut:#6c7a72;--line:#d7e1db;--bg:#f6f8f6;--acc:#b4501f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'IBM Plex Sans KR',system-ui,sans-serif}
    header{background:var(--g);color:#fff;padding:22px 16px 22px}
    header .in,main{max-width:560px;margin:0 auto}
    header a{color:#fff;opacity:.85;font-size:13px;text-decoration:none}
    header a:hover{opacity:1;text-decoration:underline}
    header small{display:block;opacity:.8;font-size:13px;margin-top:14px}
    header h1{margin:4px 0 0;font-size:24px;font-weight:700}
    main{padding:20px 16px}
    .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}
    .lede{color:var(--mut);font-size:14px;margin:0 0 18px}
    .test{background:#fff6cc;border:1px solid #e8d47a;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px}
    label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
    label span{font-weight:400;color:var(--mut)}
    select,input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit}
    select:focus,input:focus{outline:2px solid var(--g);outline-offset:1px}
    button,.btn{display:block;width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:var(--g);color:#fff;font:600 16px 'IBM Plex Sans KR',sans-serif;text-align:center;text-decoration:none;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .err{color:var(--acc);font-size:14px;margin-top:12px}
    .done h2{margin:0 0 6px;font-size:20px;color:var(--g)}
    .note{font-size:13px;color:var(--mut);margin-top:14px}
    .loading{color:var(--mut)}
    #newLab{display:none}
    footer{text-align:center;font-size:13px;color:var(--mut);padding:8px 16px 30px}
    footer a{color:var(--g)}
  </style>
</head>
<body>
  <header><div class="in">
    <a href="./">← 학회 홈페이지</a>
    <small id="t">The 33rd Korean C. elegans Meeting</small>
    <h1>연구실 참석자 등록</h1>
  </div></header>
  <main><div class="card" id="box"><p class="loading">연구실 목록을 불러오는 중…</p></div></main>
  <footer id="foot"></footer>

  <script src="config.js"></script>
  <script>
  (function () {
    // 등록 API = Apps Script 웹 앱 주소 (config.js의 register_api)
    const API = (window.SITE_CONFIG && window.SITE_CONFIG.register_api) || "";
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    let V = { contact: "" };

    function fail(msg) {
      $("#box").innerHTML = '<p>' + esc(msg) + '</p><p class="note">잠시 뒤 새로고침해 주세요. 계속 안 되면 조직위원회로 연락해 주세요.</p>';
    }

    // 쿠키 없이 호출 → 구글 계정이 여러 개 로그인돼 있어도 동작
    async function load() {
      if (!API) return fail("등록 페이지가 아직 연결되지 않았습니다.");
      try {
        const r = await fetch(API + "?api=labs", { credentials: "omit" });
        V = await r.json();
        if (V.status === "error") throw new Error(V.message);
      } catch (e) {
        return fail("연구실 목록을 불러오지 못했습니다.");
      }
      if (V.title) $("#t").textContent = V.title;
      $("#foot").innerHTML = V.contact ? "문의 " + esc(V.contact) : "";
      form();
    }

    function form() {
      if (!V.open) {
        $("#box").innerHTML = '<p>참석자 등록이 마감되었습니다.</p><p class="note">변경이 필요하면 ' + esc(V.contact) + " 로 연락해 주세요.</p>";
        return;
      }
      $("#box").innerHTML =
        (V.test ? '<div class="test">🧪 테스트 모드: [TEST] 시트가 만들어지고, 메일은 조직위 테스트 주소로만 갑니다.</div>' : "") +
        '<p class="lede">연구실마다 <b>방장(연락 담당자) 한 분</b>이 등록합니다. 등록하면 우리 연구실 전용 구글 시트가 열리고, 같은 링크가 메일로도 갑니다. 입력 마감 <b>' + esc(V.deadline) + "</b>.</p>" +
        '<label for="lab">우리 연구실 (PI)</label><select id="lab"><option value="">선택해 주세요</option>' +
        (V.labs || []).map((l) => '<option value="' + esc(l.id) + '">' + esc(l.pi) + (l.aff ? " (" + esc(l.aff) + ")" : "") + "</option>").join("") +
        '<option value="__new__">목록에 없음 (신규 PI)</option></select>' +
        '<div id="newLab"><label for="pi">PI 이름</label><input id="pi" autocomplete="off"><label for="aff">소속 <span>(학교·기관, 학과)</span></label><input id="aff" autocomplete="off"></div>' +
        '<label for="nm">방장 이름</label><input id="nm" autocomplete="name">' +
        '<label for="em">방장 이메일 <span>(링크를 받을 주소)</span></label><input id="em" type="email" autocomplete="email">' +
        '<button id="go">등록하고 우리 연구실 시트 열기</button><div class="err" id="err" role="alert"></div>' +
        '<p class="note">이미 등록했는데 링크를 잃어버렸다면, 같은 연구실·같은 이메일로 다시 등록하면 같은 시트가 열립니다.</p>';
      $("#lab").onchange = (e) => { $("#newLab").style.display = e.target.value === "__new__" ? "block" : "none"; };
      $("#go").onclick = submit;
    }

    async function submit() {
      const d = { labId: $("#lab").value, newPi: $("#pi").value, newAff: $("#aff").value, name: $("#nm").value, email: $("#em").value };
      const err = $("#err"), b = $("#go");
      err.textContent = "";
      if (!d.labId) { err.textContent = "연구실을 선택해 주세요."; return; }
      if (d.labId === "__new__" && !d.newPi.trim()) { err.textContent = "PI 이름을 적어 주세요."; return; }
      if (!d.name.trim()) { err.textContent = "방장 이름을 적어 주세요."; return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email.trim())) { err.textContent = "이메일 주소를 확인해 주세요."; return; }
      b.disabled = true; b.textContent = "시트를 준비하는 중… (10초 정도)";
      try {
        // text/plain → 브라우저 사전 요청 없이 바로 전송
        const r = await fetch(API, { method: "POST", credentials: "omit", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(d) });
        const res = await r.json();
        if (res.status === "error") throw new Error(res.message);
        done(res);
      } catch (e) {
        b.disabled = false; b.textContent = "등록하고 우리 연구실 시트 열기";
        err.textContent = (e && e.message && !/fetch|JSON|network/i.test(e.message)) ? e.message : "오류가 났습니다. 잠시 뒤 다시 시도해 주세요.";
      }
    }

    function done(r) {
      if (r.status === "taken") {
        $("#box").innerHTML = '<div class="done"><h2>이미 방장이 등록된 연구실입니다</h2><p>' + esc(r.pi) + " 연구실은 <b>" + esc(r.who) +
          '</b> 님이 등록했습니다. 그분 메일로 시트 링크를 다시 보내드렸습니다.</p><p class="note">방장이 바뀌어야 한다면 ' + esc(V.contact) + " 로 알려 주세요.</p></div>";
        return;
      }
      $("#box").innerHTML = '<div class="done"><h2>등록되었습니다</h2><p>' + esc(r.pi) + " 연구실 전용 시트" + (r.created ? "를 만들었습니다" : "입니다") +
        ". 같은 링크를 메일로도 보냈습니다.</p>" +
        '<a class="btn" href="' + esc(r.url) + '">우리 연구실 시트 열기 →</a>' +
        '<p class="note">한 줄에 한 명, PI 본인 포함. 발표자는 시트 맨 위 "초록 제출하기" 링크로 초록을 내 주세요 (구두는 연구실별 2명까지).</p></div>';
    }

    load();
  })();
  </script>
</body>
</html>
